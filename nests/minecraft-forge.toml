version = "1.00"
# Minecraft: Forge (installer downloaded at install time, run on first boot).

id = "minecraft-forge"
name = "Minecraft Forge"
author = "Rabbictyl"
description = "Forge Edition servers"

[[egg]]
id = "forge"
name = "Minecraft Forge"
description = "Forge, the classic Minecraft: Java Edition mod loader. The installer runs on first boot; FORGE_VERSION can be left empty to use the latest build for MC_VERSION."
docker_image = "ghcr.io/pterodactyl/yolks:java_21"
startup = "sh -c \"if [ ! -f forge-installed ] && [ -f forge-installer.jar ]; then java -jar forge-installer.jar --installServer && touch forge-installed; fi; if [ -f run.sh ]; then exec sh run.sh; else exec java -Xms128M -Xmx{{SERVER_MEMORY}}M -jar {{SERVER_JARFILE}} nogui; fi\""
done = ['regex:.*Done \(.*\)!']
stop_type = "command"
stop_value = "stop"
script_container = "ghcr.io/pterodactyl/installers:alpine"
script_entrypoint = "ash"
script_install = """
#!/bin/ash
set -e
apk add --no-cache curl jq
forge="${FORGE_VERSION}"
if [ -z "${forge}" ] || [ "${forge}" = "latest" ]; then
  forge=$(curl -fsSL https://files.minecraftforge.net/net/minecraftforge/forge/promotions_slim.json | jq -r --arg key "${MC_VERSION}-latest" '.promos[$key] // empty')
fi
if [ -z "${forge}" ]; then
  echo "No Forge build found for Minecraft ${MC_VERSION}; set FORGE_VERSION manually." >&2
  exit 1
fi
curl -fsSL -o forge-installer.jar "https://maven.minecraftforge.net/net/minecraftforge/forge/${MC_VERSION}-${forge}/forge-${MC_VERSION}-${forge}-installer.jar"
echo "Downloaded Forge ${MC_VERSION}-${forge} installer"
"""

[egg.variables]
SERVER_JARFILE = "server.jar"
MC_VERSION = "26.3"
FORGE_VERSION = "latest"
