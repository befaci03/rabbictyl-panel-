version = "1.00"
# nginx: one egg without PHP, one with php-fpm for every supported PHP release.

id = "nginx"
name = "nginx"
author = "Rabbictyl"
description = "Static and PHP sites served by nginx"

[[egg]]
id = "nginx"
name = "nginx (no PHP)"
description = "Plain nginx serving /home/container on the allocated port."
default_docker_img = "nginx:1.31-alpine"
docker_images = [
    "nginx:1.31-alpine||nginx (no PHP)",
]
startup = "sh /home/container/start.sh {{SERVER_PORT}}"
script_container = "alpine:3.20"
script_entrypoint = "ash"
script_install = """
#!/bin/ash
set -e
if [ -f start.sh ]; then
  echo "start.sh already exists, keeping your version"
else
  cat > start.sh <<'NGINXEOF'
#!/bin/sh
set -e
PORT="${1:-8080}"
case "$PORT" in *[!0-9]*) PORT=8080 ;; esac
mkdir -p /tmp/nginx
cat > /tmp/nginx/nginx.conf <<'CONF'
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;
    server {
        listen __PORT__;
        server_name _;
        root /home/container;
        index index.html index.php;
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
CONF
sed -i "s/__PORT__/${PORT}/g" /tmp/nginx/nginx.conf
exec nginx -c /tmp/nginx/nginx.conf -g 'daemon off;'
NGINXEOF
  chmod +x start.sh
  if [ ! -f index.html ]; then
    printf '<!doctype html>\n<title>nginx</title>\n<h1>It works</h1>\n' > index.html
  fi
  echo "Created start.sh and a starter index.html"
fi
"""

[egg.variables]

[[egg]]
id = "nginx_php"
name = "nginx + PHP"
description = "nginx with php-fpm serving /home/container; pick the PHP version as the docker image."
default_docker_img = "webdevops/php-nginx:8.5"
docker_images = [
    "webdevops/php-nginx:8.5||PHP 8.5",
    "webdevops/php-nginx:8.4||PHP 8.4",
    "webdevops/php-nginx:8.3||PHP 8.3",
]
startup = "sh /home/container/start.sh {{SERVER_PORT}}"
script_container = "alpine:3.20"
script_entrypoint = "ash"
script_install = """
#!/bin/ash
set -e
if [ -f start.sh ]; then
  echo "start.sh already exists, keeping your version"
else
  cat > start.sh <<'NGINXEOF'
#!/bin/sh
set -e
PORT="${1:-8080}"
case "$PORT" in *[!0-9]*) PORT=8080 ;; esac
mkdir -p /tmp/nginx
cat > /tmp/nginx/php-fpm.conf <<'FPM'
[global]
error_log = /proc/self/fd/2
daemonize = no
[www]
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
user = www-data
group = www-data
FPM
cat > /tmp/nginx/nginx.conf <<'CONF'
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;
    server {
        listen __PORT__;
        server_name _;
        root /home/container;
        index index.html index.php;
        location / {
            try_files $uri $uri/ =404;
        }
        location ~ \\.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_pass 127.0.0.1:9000;
        }
    }
}
CONF
sed -i "s/__PORT__/${PORT}/g" /tmp/nginx/nginx.conf
php-fpm -F -y /tmp/nginx/php-fpm.conf &
exec nginx -c /tmp/nginx/nginx.conf -g 'daemon off;'
NGINXEOF
  chmod +x start.sh
  if [ ! -f index.php ]; then
    printf '<?php phpinfo();\n' > index.php
  fi
  echo "Created start.sh and a starter index.php"
fi
"""

[egg.variables]
