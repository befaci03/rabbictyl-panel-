version = "1.00"
# Minecraft: Fabric (loader resolved from the Fabric meta API during install).

id = "minecraft-fabric"
name = "Minecraft Fabric"
author = "Rabbictyl"
description = "Fabric Edition servers"

[[egg]]
id = "fabric"
name = "Minecraft Fabric"
description = "Fabric, the lightweight experimental mod loader for vanilla."
docker_image = "ghcr.io/pterodactyl/yolks:java_21"
startup = "java -Xms128M -Xmx{{SERVER_MEMORY}}M -jar {{SERVER_JARFILE}}"
done = ['regex:.*Done \(.*\)!']
stop_type = "command"
stop_value = "stop"
script_container = "ghcr.io/pterodactyl/installers:alpine"
script_entrypoint = "ash"
script_install = """
#!/bin/ash
set -e
apk add --no-cache curl jq
loader="${FABRIC_LOADER}"
if [ -z "${loader}" ] || [ "${loader}" = "latest" ]; then
  loader=$(curl -fsSL https://meta.fabricmc.net/v2/versions/loader | jq -r '.[0].version')
fi
curl -fsSL -o "${SERVER_JARFILE}" "https://meta.fabricmc.net/v2/versions/loader/${MC_VERSION}/${loader}/server/jar"
echo "Installed Fabric ${loader} for ${MC_VERSION} as ${SERVER_JARFILE}"
"""

[egg.variables]
SERVER_JARFILE = "server.jar"
MC_VERSION = "26.3"
FABRIC_LOADER = "latest"
