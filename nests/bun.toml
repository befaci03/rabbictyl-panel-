version = "1.00"
id = "bun"
name = "Bun"
author = "Rabbictyl"
description = "Bun JavaScript/TypeScript runtime"

[[egg]]
id = "bun"
name = "Bun"
description = "Runs a Bun entry script with the Bun image you pick. Upload your sources and it starts with bun."
default_docker_img = "oven/bun:latest"
docker_images = [
    "oven/bun:latest||Bun (latest)",
    "oven/bun:1.4||Bun 1.4",
    "oven/bun:1.3||Bun 1.3",
    "oven/bun:1.2||Bun 1.2",
    "oven/bun:1.1||Bun 1.1",
    "oven/bun:1.0||Bun 1.0",
]
startup = "bun run {{MAIN_FILE}}"

[egg.variables]
MAIN_FILE = "index.ts"
