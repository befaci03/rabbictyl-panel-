# Nests are plain TOML files. Every `[[egg]]` entry becomes a game template in
# the panel, and the deterministic UUID means servers keep pointing at the same
# template across restarts.
#
# `done` is the list of console patterns that mark a server as running. Leave it
# empty and pats treats the server as running the moment it boots (no "starting"
# state to wait through).

id = "minecraft"
name = "Minecraft"
author = "RabbiCtyl"
description = "Java edition servers"

[[egg]]
id = "java"
name = "Minecraft Java"
description = "Vanilla, Paper or any other server jar."
docker_image = "ghcr.io/pterodactyl/yolks:java_21"
startup = "java -Xms128M -Xmx{{SERVER_MEMORY}}M -jar {{SERVER_JARFILE}}"
done = ['regex:.*Done \(.*\)! For help, type "help"']
stop_type = "command"
stop_value = "stop"
script_container = "ghcr.io/pterodactyl/installers:alpine"
script_entrypoint = "ash"
script_install = """
#!/bin/ash
set -e
apk add --no-cache curl
curl -fsSL -o "${SERVER_JARFILE}" "https://api.papermc.io/v2/projects/paper/versions/${MC_VERSION}/builds/latest/downloads/paper-${MC_VERSION}-latest.jar"
echo "Installed ${SERVER_JARFILE}"
"""

[egg.variables]
SERVER_JARFILE = "server.jar"
MC_VERSION = "1.21.1"
