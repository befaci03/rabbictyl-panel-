version = "1.00"
# Minecraft: Folia (PaperMC's multithreaded regional fork).

id = "minecraft-folia"
name = "Minecraft Folia"
author = "Rabbictyl"
description = "Folia Edition servers"

[[egg]]
id = "folia"
name = "Minecraft Folia"
description = "Folia, the multithreaded Paper fork with regionised ticking."
docker_image = "ghcr.io/pterodactyl/yolks:java_21"
startup = "java -Xms128M -Xmx{{SERVER_MEMORY}}M -jar {{SERVER_JARFILE}}"
done = ['regex:.*Done \(.*\)!']
stop_type = "command"
stop_value = "stop"
script_container = "ghcr.io/pterodactyl/installers:alpine"
script_entrypoint = "ash"
script_install = """
#!/bin/ash
set -e
apk add --no-cache curl
curl -fsSL -o "${SERVER_JARFILE}" "https://api.papermc.io/v2/projects/folia/versions/${MC_VERSION}/builds/latest/downloads/folia-${MC_VERSION}-latest.jar"
echo "Installed ${SERVER_JARFILE}"
"""

[egg.variables]
SERVER_JARFILE = "server.jar"
MC_VERSION = "26.3"
