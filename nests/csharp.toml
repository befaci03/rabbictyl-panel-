version = "1.00"
# C# / .NET: one egg, every SDK from 7.0 to 10.0 as a docker image.

id = "csharp"
name = "C# / .NET"
author = "Rabbictyl"
description = "C# applications and services on .NET"

[[egg]]
id = "dotnet"
name = ".NET"
description = "C# on .NET. Pick the SDK image matching your target framework."
default_docker_img = "mcr.microsoft.com/dotnet/sdk:10.0"
docker_images = [
    "mcr.microsoft.com/dotnet/sdk:10.0||.NET 10",
    "mcr.microsoft.com/dotnet/sdk:9.0||.NET 9",
    "mcr.microsoft.com/dotnet/sdk:8.0||.NET 8",
    "mcr.microsoft.com/dotnet/sdk:7.0||.NET 7",
]
startup = "sh -c 'ASPNETCORE_URLS=http://0.0.0.0:{{SERVER_PORT}} dotnet run --project {{DOTNET_PROJECT}} --no-launch-profile'"
script_container = "mcr.microsoft.com/dotnet/sdk:10.0"
script_entrypoint = "sh"
script_install = """
#!/bin/sh
set -e
if ! ls ./*.csproj >/dev/null 2>&1; then
  dotnet new console -n server -o .
  echo "Created starter project server.csproj"
fi
dotnet build -c Release --nologo
echo "Build finished"
"""

[egg.variables]
DOTNET_PROJECT = "."
