version = "1.00"
# VPS-style servers: one egg, one image per distro. The install script seeds
# start.sh once; edit it in the file manager to run anything you like.

id = "vps"
name = "VPS"
author = "Rabbictyl"
description = "Custom Linux servers driven by your own start.sh"

[[egg]]
id = "vps"
name = "VPS"
description = "A bare Linux container driven by your own start.sh. Pick the distro as the docker image."
default_docker_img = "ubuntu:24.04"
docker_images = [
    "ubuntu:24.04||Ubuntu 24.04",
    "alpine:3.20||Alpine 3.20",
    "debian:12||Debian 12",
    "archlinux:latest||Arch Linux",
]
startup = "sh /home/container/start.sh {{SERVER_PORT}}"
script_container = "alpine:3.20"
script_entrypoint = "ash"
script_install = """
#!/bin/ash
set -e
if [ -f start.sh ]; then
  echo "start.sh already exists, keeping your version"
else
  cat > start.sh <<'VPSEOF'
#!/bin/sh
# Custom VPS entrypoint. $1 is the allocated server port when the panel
# substitutes {{SERVER_PORT}}; non-numeric values fall back to PORT below.
PORT="${1:-25565}"
case "$PORT" in *[!0-9]*) PORT=25565 ;; esac
echo "VPS container up, allocated port: ${PORT}"
# Replace this loop with whatever you want the server to run, e.g.:
#   ./my-binary --port "${PORT}"
while :; do sleep 3600; done
VPSEOF
  chmod +x start.sh
  echo "Created start.sh - edit it to run whatever you need"
fi
"""

[egg.variables]
