version = "1.00"
# Minecraft: Spigot (built from source with BuildTools during install).

id = "minecraft-spigot"
name = "Minecraft Spigot"
author = "Rabbictyl"
description = "Spigot Edition servers"

[[egg]]
id = "spigot"
name = "Minecraft Spigot"
description = "Spigot, built from source with BuildTools (install takes several minutes)."
docker_image = "ghcr.io/pterodactyl/yolks:java_21"
startup = "java -Xms128M -Xmx{{SERVER_MEMORY}}M -jar {{SERVER_JARFILE}}"
done = ['regex:.*Done \(.*\)!']
stop_type = "command"
stop_value = "stop"
script_container = "ghcr.io/pterodactyl/installers:alpine"
script_entrypoint = "ash"
script_install = """
#!/bin/ash
set -e
apk add --no-cache curl git
apk add --no-cache openjdk21-jdk >/dev/null 2>&1 || apk add --no-cache openjdk21 >/dev/null 2>&1 || apk add --no-cache openjdk21-jre-headless
curl -fsSL -o BuildTools.jar https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/BuildTools.jar
java -jar BuildTools.jar --rev "${MC_VERSION}"
jar=$(ls -1 spigot*.jar | grep -v sources | head -n 1)
cp -f "${jar}" "${SERVER_JARFILE}"
rm -f BuildTools.jar
echo "Installed ${SERVER_JARFILE}"
"""

[egg.variables]
SERVER_JARFILE = "server.jar"
MC_VERSION = "26.3"
