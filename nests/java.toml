version = "1.00"
# Generic Java runtime. One egg per Java release; pick the egg that matches the
# runtime your jar needs. Latest release: Java 27.

id = "java"
name = "Java"
author = "Rabbictyl"
description = "Java applications and game servers"

[[egg]]
id = "java_8"
name = "Java 8"
description = "Runs a jar with Java 8 (1.8)."
docker_image = "ghcr.io/pterodactyl/yolks:java_8"
startup = "java -Xms128M -Xmx{{SERVER_MEMORY}}M -jar {{SERVER_JARFILE}}"

[egg.variables]
SERVER_JARFILE = "server.jar"

