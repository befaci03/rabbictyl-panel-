version = "1.00"
id = "golang"
name = "Go"
author = "Rabbictyl"
description = "Go applications"

[[egg]]
id = "golang"
name = "Go"
description = "Builds a Go module during setup and runs the resulting binary (falls back to go run)."
docker_image = "golang:1.27"
startup = "sh -c 'if [ -x ./server ]; then exec ./server; elif [ -f go.mod ]; then exec go run .; else echo \"No Go code found - run the install script\" >&2; exit 1; fi'"
script_container = "golang:1.27"
script_entrypoint = "sh"
script_install = """
#!/bin/sh
set -e
if [ ! -f go.mod ]; then
  printf 'package main\n\nimport "fmt"\n\nfunc main() {\n\tfmt.Println("Hello from Go")\n}\n' > main.go
  go mod init server
  echo "Created starter main.go"
fi
go build -o server .
echo "Built ./server"
"""

[egg.variables]
