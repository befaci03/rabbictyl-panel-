version = "1.00"
# Minecraft: SteelMC, an independent Minecraft: Java Edition server written in Rust.

id = "minecraft-steelmc"
name = "Minecraft SteelMC"
author = "Rabbictyl"
description = "SteelMC servers (Rust)"

[[egg]]
id = "steelmc"
name = "Minecraft SteelMC"
description = "SteelMC, an independent Minecraft: Java Edition server implementation written in Rust."
docker_image = "ghcr.io/pterodactyl/yolks:debian"
startup = "./steel"
stop_type = "command"
stop_value = "stop"
script_container = "ghcr.io/pterodactyl/installers:alpine"
script_entrypoint = "ash"
script_install = """
#!/bin/ash
set -e
apk add --no-cache curl
curl -fsSL -o steel "https://github.com/Steel-Foundation/SteelMC/releases/latest/download/steel-linux"
chmod +x steel
echo "Installed SteelMC ($(./steel --version 2>/dev/null || echo latest))"
"""

[egg.variables]
