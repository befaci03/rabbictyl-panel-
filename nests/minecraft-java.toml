version = "1.00"
# Minecraft: Java Edition. One egg per server flavour; Java-based eggs offer
# every Java release from 8 to 27 as a docker image, so one egg covers old and
# new Minecraft versions.

id = "minecraft-java"
name = "Minecraft: Java Edition"
author = "Rabbictyl"
description = "Paper, Fabric, Forge and the other Java Edition server flavours."

[[egg]]
id = "paper"
name = "Minecraft Paper"
description = "Paper, the high performance Minecraft: Java Edition server."
default_docker_img = "ghcr.io/pterodactyl/yolks:java_21"
docker_images = [
    "ghcr.io/pterodactyl/yolks:java_8||Java 8",
    "ghcr.io/pterodactyl/yolks:java_9||Java 9",
    "ghcr.io/pterodactyl/yolks:java_10||Java 10",
    "ghcr.io/pterodactyl/yolks:java_11||Java 11",
    "ghcr.io/pterodactyl/yolks:java_12||Java 12",
    "ghcr.io/pterodactyl/yolks:java_13||Java 13",
    "ghcr.io/pterodactyl/yolks:java_14||Java 14",
    "ghcr.io/pterodactyl/yolks:java_15||Java 15",
    "ghcr.io/pterodactyl/yolks:java_16||Java 16",
    "ghcr.io/pterodactyl/yolks:java_17||Java 17",
    "ghcr.io/pterodactyl/yolks:java_18||Java 18",
    "ghcr.io/pterodactyl/yolks:java_19||Java 19",
    "ghcr.io/pterodactyl/yolks:java_20||Java 20",
    "ghcr.io/pterodactyl/yolks:java_21||Java 21",
    "ghcr.io/pterodactyl/yolks:java_22||Java 22",
    "ghcr.io/pterodactyl/yolks:java_23||Java 23",
    "ghcr.io/pterodactyl/yolks:java_24||Java 24",
    "ghcr.io/pterodactyl/yolks:java_25||Java 25",
    "ghcr.io/pterodactyl/yolks:java_26||Java 26",
    "ghcr.io/pterodactyl/yolks:java_27||Java 27",
]
startup = "java -Xms128M -Xmx{{SERVER_MEMORY}}M -jar {{SERVER_JARFILE}}"
done = ['regex:.*Done \(.*\)!']
stop_type = "command"
stop_value = "stop"
script_container = "ghcr.io/pterodactyl/installers:alpine"
script_entrypoint = "ash"
script_install = """
#!/bin/ash
set -e
apk add --no-cache curl
curl -fsSL -o "${SERVER_JARFILE}" "https://api.papermc.io/v2/projects/paper/versions/${MC_VERSION}/builds/latest/downloads/paper-${MC_VERSION}-latest.jar"
echo "Installed ${SERVER_JARFILE}"
"""

[egg.variables]
SERVER_JARFILE = "server.jar"
MC_VERSION = "26.3"

