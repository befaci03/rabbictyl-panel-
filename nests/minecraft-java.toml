[[egg]]
id = "forge"
name = "Minecraft Forge"
description = "Forge, the classic Minecraft: Java Edition mod loader. The installer runs on first boot; FORGE_VERSION can be left empty to use the latest build for MC_VERSION."
default_docker_img = "ghcr.io/pterodactyl/yolks:java_21"
docker_images = [
    "ghcr.io/pterodactyl/yolks:java_8||Java 8",
    "ghcr.io/pterodactyl/yolks:java_9||Java 9",
    "ghcr.io/pterodactyl/yolks:java_10||Java 10",
    "ghcr.io/pterodactyl/yolks:java_11||Java 11",
    "ghcr.io/pterodactyl/yolks:java_12||Java 12",
    "ghcr.io/pterodactyl/yolks:java_13||Java 13",
    "ghcr.io/pterodactyl/yolks:java_14||Java 14",
    "ghcr.io/pterodactyl/yolks:java_15||Java 15",
    "ghcr.io/pterodactyl/yolks:java_16||Java 16",
    "ghcr.io/pterodactyl/yolks:java_17||Java 17",
    "ghcr.io/pterodactyl/yolks:java_18||Java 18",
    "ghcr.io/pterodactyl/yolks:java_19||Java 19",
    "ghcr.io/pterodactyl/yolks:java_20||Java 20",
    "ghcr.io/pterodactyl/yolks:java_21||Java 21",
    "ghcr.io/pterodactyl/yolks:java_22||Java 22",
    "ghcr.io/pterodactyl/yolks:java_23||Java 23",
    "ghcr.io/pterodactyl/yolks:java_24||Java 24",
    "ghcr.io/pterodactyl/yolks:java_25||Java 25",
    "ghcr.io/pterodactyl/yolks:java_26||Java 26",
    "ghcr.io/pterodactyl/yolks:java_27||Java 27",
]
startup = "sh -c \"if [ ! -f forge-installed ] && [ -f forge-installer.jar ]; then java -jar forge-installer.jar --installServer && touch forge-installed; fi; if [ -f run.sh ]; then exec sh run.sh; else exec java -Xms128M -Xmx{{SERVER_MEMORY}}M -jar {{SERVER_JARFILE}} nogui; fi\""
done = ['regex:.*Done \(.*\)!']
stop_type = "command"
stop_value = "stop"
script_container = "ghcr.io/pterodactyl/installers:alpine"
script_entrypoint = "ash"
script_install = """
#!/bin/ash
set -e
apk add --no-cache curl jq
forge="${FORGE_VERSION}"
if [ -z "${forge}" ] || [ "${forge}" = "latest" ]; then
  forge=$(curl -fsSL https://files.minecraftforge.net/net/minecraftforge/forge/promotions_slim.json | jq -r --arg key "${MC_VERSION}-latest" '.promos[$key] // empty')
fi
if [ -z "${forge}" ]; then
  echo "No Forge build found for Minecraft ${MC_VERSION}; set FORGE_VERSION manually." >&2
  exit 1
fi
curl -fsSL -o forge-installer.jar "https://maven.minecraftforge.net/net/minecraftforge/forge/${MC_VERSION}-${forge}/forge-${MC_VERSION}-${forge}-installer.jar"
echo "Downloaded Forge ${MC_VERSION}-${forge} installer"
"""

[egg.variables]
SERVER_JARFILE = "server.jar"
MC_VERSION = "26.3"
FORGE_VERSION = "latest"

