version = "1.00"
# Minecraft: Sponge (SpongeVanilla from the SpongePowered repository).

id = "minecraft-sponge"
name = "Minecraft Sponge"
author = "Rabbictyl"
description = "Sponge Edition servers"

[[egg]]
id = "sponge"
name = "Minecraft Sponge"
description = "SpongeVanilla, the Sponge API implementation for Minecraft: Java Edition."
docker_image = "ghcr.io/pterodactyl/yolks:java_21"
startup = "java -Xms128M -Xmx{{SERVER_MEMORY}}M -jar {{SERVER_JARFILE}}"
done = ['regex:.*Done \(.*\)!']
stop_type = "command"
stop_value = "stop"
script_container = "ghcr.io/pterodactyl/installers:alpine"
script_entrypoint = "ash"
script_install = """
#!/bin/ash
set -e
apk add --no-cache curl
repo="https://repo.spongepowered.org/repository/maven-public/org/spongepowered/spongevanilla"
ver="${SPONGE_VERSION}"
if [ -z "${ver}" ] || [ "${ver}" = "latest" ]; then
  ver=$(curl -fsSL "${repo}/maven-metadata.xml" | grep -o '<release>[^<]*</release>' | sed 's/<[^>]*>//g')
fi
curl -fsSL -o "${SERVER_JARFILE}" "${repo}/${ver}/spongevanilla-${ver}.jar"
echo "Installed SpongeVanilla ${ver} as ${SERVER_JARFILE}"
"""

[egg.variables]
SERVER_JARFILE = "server.jar"
SPONGE_VERSION = "latest"
